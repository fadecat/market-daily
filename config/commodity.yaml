# 商品极值监控日报配置(core profile)。
# 移植自 commodity-monitor-days/config/monitor.toml,去掉 wechat/degrade 配置。
scan:
  delay_min_seconds: 2.0
  delay_max_seconds: 4.0
  max_stale_days: 10
  skip_if_no_today_data: true

thresholds:
  high_percentile: 85
  low_percentile: 30

windows:
  d21: 21
  d63: 63
  y1: 252
  y3: 756
  y5: 1260
  y10: 2520

