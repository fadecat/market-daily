# 市场估值板块标的配置
# 仅 type: valuation 的标的;type: etf/index 的回撤监控分支已退役。
# 字段:
#   name                 标的名称
#   code                 标的代码(用于归档命名/展示)
#   index_detail_url     易方达 efunds/etf.com.cn 指数详情接口(PE/PB/股息率)
#   index_dividend_yield_url  可选,独立股息率 JSON(覆盖 detail 接口)
#   spread_overlay         可选,true 时 PE 分位图叠股债利差右轴(缺省不画)
#   pb_chart               可选,true 时在 PE 分位图之后再出一张 PB 走势图(缺省不出)。
#                          是否开启的判据是 PE 与 PB 的 5 年水平相关:相关越低,PB 的
#                          分位标尺越能提供 PE 给不了的独立信息。当前开启三个:
#                            930709 香港证券指数  corr≈0.35 —— 隐含 ROE(PB/PE)处 5 年
#                              极高位(分位≈100%),低 PE 分位是"高盈利造成的便宜幻觉",
#                              PB 才是中性刻度,周期股尤其需要。
#                            000300 沪深300       corr≈0.73
#                            399303 国证2000       corr≈0.79
#                          其余指数 corr≥0.92,PB 图与 PE 图信息高度重合,暂不开启。

targets:

  - name: "中证价值100"
    code: "512040"
    type: "valuation"
    index_detail_url: "https://www.etf.com.cn/api/etf-api-service/index/detail?indexCode=931052"

  - name: "国证价值100"
    code: "159263"
    type: "valuation"
    index_detail_url: "https://www.etf.com.cn/api/etf-api-service/index/detail?indexCode=980081"

  - name: "红利低波动100"
    code: "930955"
    type: "valuation"
    spread_overlay: true
    index_detail_url: "https://www.etf.com.cn/api/etf-api-service/index/detail?indexCode=930955"
    index_dividend_yield_url: "https://cdn.efunds.com.cn/etf-net/index_dividend_ratio_930955.json"

  - name: "沪深300"
    code: "000300"
    type: "valuation"
    spread_overlay: true
    pb_chart: true
    index_detail_url: "https://www.etf.com.cn/api/etf-api-service/index/detail?indexCode=000300"

  - name: "国证2000"
    code: "399303"
    type: "valuation"
    pb_chart: true
    index_detail_url: "https://www.etf.com.cn/api/etf-api-service/index/detail?indexCode=399303"

  - name: "深证成长40指数"
    code: "399326"
    type: "valuation"
    index_detail_url: "https://www.etf.com.cn/api/etf-api-service/index/detail?indexCode=399326"

  - name: "港股通央企红利"
    code: "931233"
    type: "valuation"
    index_detail_url: "https://www.etf.com.cn/api/etf-api-service/index/detail?indexCode=931233"

  - name: "香港证券指数"
    code: "930709"
    type: "valuation"
    pb_chart: true
    index_detail_url: "https://www.etf.com.cn/api/etf-api-service/index/detail?indexCode=930709"
