name: Setup Python + CJK fonts
description: 安装 Python、CJK 字体(fonts-noto-cjk,避免图中文字方框)与项目依赖(requirements.txt),各 workflow 复用

inputs:
  python-version:
    description: Python 版本
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install CJK fonts
      shell: bash
      # 单次尝试限时 + 重试:runner 到 apt 源的连接挂起时,杀掉重连,
      # 避免无限等待把 job 的 timeout-minutes 耗尽(2026-08-19 下午全板块中招)
      run: |
        for attempt in 1 2 3; do
          echo "apt attempt $attempt/3"
          if timeout 300 sudo apt-get update && timeout 300 sudo apt-get install -y fonts-noto-cjk; then
            break
          fi
          if [ "$attempt" = 3 ]; then
            echo "::error::apt-get 三次尝试均失败"
            exit 1
          fi
          sleep 15
        done

    - name: Install dependencies
      shell: bash
      run: |
        for attempt in 1 2 3; do
          echo "pip attempt $attempt/3"
          if timeout 180 python -m pip install --upgrade pip && \
             timeout 600 pip install -r requirements.txt; then
            break
          fi
          if [ "$attempt" = 3 ]; then
            echo "::error::pip install 三次尝试均失败"
            exit 1
          fi
          sleep 15
        done
