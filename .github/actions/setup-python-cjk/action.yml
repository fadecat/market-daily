name: Setup Python + CJK fonts
description: 安装 Python、CJK 字体(fonts-noto-cjk,避免图中文字方框)与项目依赖(requirements.txt),各 workflow 复用

inputs:
  python-version:
    description: Python 版本
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install CJK fonts
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-noto-cjk

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
