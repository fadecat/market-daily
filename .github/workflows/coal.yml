name: 煤炭日报

on:
  schedule:
    # UTC 07:40 = Asia/Shanghai 15:40(收盘后);与其它板块错峰提交
    - cron: "40 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python + CJK fonts
        uses: ./.github/actions/setup-python-cjk

      - name: 运行煤炭日报板块
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: python -m src.coal.run

      - name: 提交 state 变更
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/state data/archive
          if git diff --cached --quiet; then
            echo "no state changes, skip commit"
          else
            git commit -m "chore: 煤炭 state 快照"
            git pull --rebase origin main
            git push
          fi
