name: efunds CDN 探测

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: curl 探测 980081 各变体
        run: |
          UA_CHROME="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36"
          probe() {
            desc="$1"; url="$2"; ua="$3"
            echo "=== $desc ==="
            curl -sS -o /tmp/out.json -w "http=%{http_code} time=%{time_total}s size=%{size_download}\n" \
              -A "$ua" --max-time 30 "$url" || echo "curl exit code $?"
            head -c 150 /tmp/out.json 2>/dev/null; echo; echo
          }
          BASE="https://cdn.efunds.com.cn/etf-net/index_dividend_ratio_980081.json"
          probe "980081 原始请求(Chrome UA)" "$BASE" "$UA_CHROME"
          probe "980081 + cache-buster(Chrome UA)" "$BASE?_=$RANDOM$RANDOM" "$UA_CHROME"
          probe "980081 python-requests UA" "$BASE" "python-requests/2.32.3"
          probe "对照组 000300 原始请求(Chrome UA)" "https://cdn.efunds.com.cn/etf-net/index_dividend_ratio_000300.json" "$UA_CHROME"
