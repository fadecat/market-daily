name: 预览与校验

on:
  schedule:
    # UTC 08:07 = Asia/Shanghai 16:07(4 板块日报跑完并提交后),仅做静态校验
    - cron: "7 8 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式: verify(仅校验) / generate(仅生成预览) / both"
        required: false
        default: "verify"
        type: choice
        options:
          - verify
          - generate
          - both

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python + CJK fonts
        uses: ./.github/actions/setup-python-cjk

      - name: 生成预览 HTML(可选)
        if: ${{ github.event.inputs.mode == 'generate' || github.event.inputs.mode == 'both' }}
        env:
          JISILU_USERNAME: ${{ secrets.JISILU_USERNAME }}
          JISILU_PASSWORD: ${{ secrets.JISILU_PASSWORD }}
          GUORN_COOKIE: ${{ secrets.GUORN_COOKIE }}
          EASTMONEY_XUANGU_COOKIE: ${{ secrets.EASTMONEY_XUANGU_COOKIE }}
        run: python -m src.preview.generate

      - name: 静态校验
        run: python -m src.preview.verify

      - name: 上传预览与报告
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview/
          if-no-files-found: ignore
          retention-days: 14
