name: 归档刷新

on:
  schedule:
    # UTC 23:00 (周日-周五) = Asia/Shanghai 次日 07:00,补齐隔夜更新的估值/国债等归档
    - cron: "0 23 * * 0-5"
    # UTC 07:00 = Asia/Shanghai 15:00(收盘后、板块日报前),刷新估值/国债/汇率/转债指数归档供板块回退读取
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python + CJK fonts
        uses: ./.github/actions/setup-python-cjk

      - name: 刷新归档
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: python -m src.valuation.refresh_archive

      - name: 提交归档变更
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/archive data/cb_index_history.json
          if git diff --cached --quiet; then
            echo "no archive changes, skip commit"
          else
            git commit -m "chore: refresh 归档快照(估值/国债/汇率/转债指数)"
            # 刷新 racy stat:python 刚写完文件就与 commit 同秒时,git 按 stat 误判"未暂存变更"
            git status --porcelain > /dev/null
            git pull --rebase origin main
            git push
          fi
