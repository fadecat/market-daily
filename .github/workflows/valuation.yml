name: 市场估值日报

on:
  schedule:
    # UTC 07:31 = Asia/Shanghai 15:31(收盘后);分钟错开避开 GitHub 整点拥堵,且与其它板块错峰提交
    - cron: "31 7 * * 1-5"
    # UTC 11:11 = Asia/Shanghai 19:11 晚间兜底补发(同日已发则 state 跳过)
    - cron: "11 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python + CJK fonts
        uses: ./.github/actions/setup-python-cjk

      - name: 运行市场估值板块
        env:
          JISILU_USERNAME: ${{ secrets.JISILU_USERNAME }}
          JISILU_PASSWORD: ${{ secrets.JISILU_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          GUORN_COOKIE: ${{ secrets.GUORN_COOKIE }}
          EASTMONEY_XUANGU_COOKIE: ${{ secrets.EASTMONEY_XUANGU_COOKIE }}
          TTM_PARENT_NET_PROFIT_MIN_YI: ${{ secrets.TTM_PARENT_NET_PROFIT_MIN_YI }}
          DIVIDEND_EMAIL_SUPPLEMENT_XCID: ${{ secrets.DIVIDEND_EMAIL_SUPPLEMENT_XCID }}
          DIVIDEND_SUPPLEMENT_PE_TTM_MAX: ${{ secrets.DIVIDEND_SUPPLEMENT_PE_TTM_MAX }}
          CNINFO_FETCH_MAX_RETRIES: ${{ vars.CNINFO_FETCH_MAX_RETRIES }}
          CNINFO_FETCH_BACKOFF_SECONDS: ${{ vars.CNINFO_FETCH_BACKOFF_SECONDS }}
          CNINFO_CACHE_MAX_AGE_DAYS: ${{ vars.CNINFO_CACHE_MAX_AGE_DAYS }}
        run: python -m src.valuation.run

      - name: 提交 state/archive 变更
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/state data/archive data/cninfo
          if git diff --cached --quiet; then
            echo "no state/archive/cninfo changes, skip commit"
          else
            git commit -m "chore: 市场估值 state/archive/cninfo 快照"
            git pull --rebase origin main
            git push
          fi
